[versions]
agp = "8.13.2"
kotlin = "2.2.21"
composeBom = "2025.11.01"

coreKtx = "1.17.0"
activityCompose = "1.12.3"
lifecycleRuntimeKtx = "2.10.0"

# P1+（docs/PHASE_DESIGN_HISTORY.md（P1+ 部分））：端侧推理改走 LiteRT（TFLite 继任者）。
# 版本对齐 LiteRT main 分支源码（Environment.create / CompiledModel.create(AssetManager,...) /
# Accelerator{NONE,CPU,GPU,NPU}）；Google Maven 上 <latest> 即 2.2.0。
# 注意：litert 只在 Google Maven（settings.gradle.kts 已配 google()）。
litert = "2.2.0"

# CI runner 的 SDK 仓库（截至 2026-08 镜像）尚未发布 platforms;android-37，
# 故 compile/target 暂对齐 minSdk=36；待官方发布 API 37 平台后改回 37。
compileSdk = "36"
minSdk = "36"
targetSdk = "36"
jvmTarget = "17"

# T1（审计 P1-11）：参数栈 ⇄ JSON。另存预设 / 项目文件 / P3 契约的共同前提。
# 1.7.x 稳定线与 Kotlin 2.2 插件兼容；版本升级时先在 JVM 单测里过一遍 round-trip。
kotlinxSerialization = "1.7.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

# P1+ 端侧推理（含 Interpreter 与 CompiledModel；v2 上 GPU 加速器已并入本包）
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }

# T1：EditSnapshot（params/retouch/layers）⇄ JSON 的编解码运行时
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# 版本全部交由 Compose BOM 管理，不在此处写死
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# UI 改版（docs/UI_DESIGN.md）：动效需要 AnimatedContent / AnimatedVisibility /
# SharedTransitionLayout（≥1.7）与 animation-core 的 spring、CubicBezierEasing。
# 此前工程只隐式依赖 material3 传递来的 animation-core，显式声明后
# AnimatedVisibility / AnimatedContent / SharedTransitionLayout 才在编译类路径上。
compose-animation = { group = "androidx.compose.animation", name = "animation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# T1：serialization 编译器插件（版本必须与 kotlin 主插件同源 —— 用同一个 version.ref）
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
