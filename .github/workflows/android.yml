name: Android CI

on:
  push:
    branches: [main]
    # 打 v* tag 时同时触发：走到 publish job 会把签名 APK 发到 GitHub Releases
    tags: ['v*']
  pull_request:
    branches: [main]
  # 允许在 GitHub 网页手动触发
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # F14：抽出的公共安装步骤（SDK/NDK/CMake），三 job 复用同一 composite action
      - name: Install toolchain (SDK / NDK / CMake)
        uses: ./.github/actions/setup-android-toolchain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # F11：CI 质量闸门——本地 JVM 单测（ColorMathTest / ArwPreviewExtractorTest）必过
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pixelcake-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      # 「证书冲突」修复的回归护栏：打印签名证书指纹。
      # 若跨构建指纹发生变化，说明 app/debug.keystore 没被用上（例如被误删或被 .gitignore 吞掉），
      # 覆盖安装会重新开始报 INSTALL_FAILED_UPDATE_INCOMPATIBLE。非致命，缺 apksigner 时跳过。
      - name: Print debug APK signer
        if: success()
        run: |
          BT=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$BT" ] || [ -z "$APK" ]; then
            echo "apksigner 或 APK 缺失，跳过签名指纹检查"
            exit 0
          fi
          echo "### debug APK 签名证书" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # F13：构建摘要（项目硬要求：Action 之后通知我）
      - name: Build summary
        if: always()
        run: |
          {
            echo "## 🍰 PixelCake CI 构建摘要"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- 触发: ${{ github.event_name }} @ \`${{ github.ref }}\`"
            echo "- 变体: debug（assembleDebug + testDebugUnitTest）"
            echo "- APK: app/build/outputs/apk/debug/*.apk（保留 90 天）"
          } >> "$GITHUB_STEP_SUMMARY"

  # F15：lint 取消 continue-on-error，成为真实拦门（Android Lint，非 ktlint/detekt）
  lint:
    name: Lint (Android Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install toolchain (SDK / NDK / CMake)
        uses: ./.github/actions/setup-android-toolchain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # secrets 上下文不允许出现在 job 级 if 中（GitHub 会直接判定 workflow 非法，
  # 导致整个文件解析失败、一个 job 都不创建）。因此单独用一个 job 探测，
  # 再把结果以 output 的形式传给 release。
  check-signing:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      has-keystore: ${{ steps.check.outputs.has }}
    steps:
      - name: Probe KEYSTORE_BASE64
        id: check
        run: echo "has=${{ secrets.KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

  # F15：release 依赖 build（含单测闸门）+ lint，任一失败不出签名包
  release:
    name: Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [build, lint, check-signing]
    if: needs.check-signing.outputs.has-keystore == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install toolchain (SDK / NDK / CMake)
        uses: ./.github/actions/setup-android-toolchain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Secrets 里存的是 openssl 导出的 PKCS12（.p12），不是 keytool 的 JKS。
      # Gradle 侧已显式声明 storeType = "PKCS12"，故文件名与后缀必须一致。
      - name: Decode keystore from Secrets
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/pixelcake.p12"

      - name: Assemble signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pixelcake.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: pixelcake-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      # R8 混淆映射表：排查 release 崩溃时用它把混淆堆栈还原成源码名。
      # 刻意只作为 Actions artifact（不上传进 Release 附件），避免把内部符号名公开出去。
      - name: Upload R8 mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pixelcake-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pixelcake.p12"

  # 只有打 tag（v*）时才发布：把「同一次构建」产出的签名 APK 挂到 GitHub Releases。
  # 用 needs 串起 build/lint/release ⇒ 「单测或 lint 没过就不发布」，也不重复构建。
  # permissions 只给这个 job 最小必要权限（contents: write 才能创建 Release）。
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, lint, release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # 轻量 checkout：让 gh 有 git 上下文（tag 名 / 远端），避免「not a git repository」
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: pixelcake-release-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          APK=$(find dist -name '*.apk' | head -1)
          # 附上版本号再挂到 Releases：否则附件名永远是千篇一律的 app-release.apk，
          # 下载到本地后无法区分版本。
          OUT="pixelcake-${GITHUB_REF_NAME}-release.apk"
          cp "$APK" "$OUT"
          # --verify-tag：tag 必须已存在（本例由 push tag 触发），不让 gh 顺手新建
          # --generate-notes：按提交自动生成 release notes
          gh release create "$GITHUB_REF_NAME" "$OUT" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
          echo "### 🍰 Release $GITHUB_REF_NAME 已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`$OUT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 页面: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
