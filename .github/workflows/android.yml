name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许在 GitHub 网页手动触发
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # F14：抽出的公共安装步骤（SDK/NDK/CMake），三 job 复用同一 composite action
      - name: Install toolchain (SDK / NDK / CMake)
        uses: ./.github/actions/setup-android-toolchain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # F11：CI 质量闸门——本地 JVM 单测（ColorMathTest / ArwPreviewExtractorTest）必过
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pixelcake-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      # F13：构建摘要（项目硬要求：Action 之后通知我）
      - name: Build summary
        if: always()
        run: |
          {
            echo "## 🍰 PixelCake CI 构建摘要"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- 触发: ${{ github.event_name }} @ \`${{ github.ref }}\`"
            echo "- 变体: debug（assembleDebug + testDebugUnitTest）"
            echo "- APK: app/build/outputs/apk/debug/*.apk（保留 90 天）"
          } >> "$GITHUB_STEP_SUMMARY"

  # F15：lint 取消 continue-on-error，成为真实拦门（Android Lint，非 ktlint/detekt）
  lint:
    name: Lint (Android Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install toolchain (SDK / NDK / CMake)
        uses: ./.github/actions/setup-android-toolchain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # secrets 上下文不允许出现在 job 级 if 中（GitHub 会直接判定 workflow 非法，
  # 导致整个文件解析失败、一个 job 都不创建）。因此单独用一个 job 探测，
  # 再把结果以 output 的形式传给 release。
  check-signing:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      has-keystore: ${{ steps.check.outputs.has }}
    steps:
      - name: Probe KEYSTORE_BASE64
        id: check
        run: echo "has=${{ secrets.KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

  # F15：release 依赖 build（含单测闸门）+ lint，任一失败不出签名包
  release:
    name: Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [build, lint, check-signing]
    if: needs.check-signing.outputs.has-keystore == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install toolchain (SDK / NDK / CMake)
        uses: ./.github/actions/setup-android-toolchain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore from Secrets
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/pixelcake.jks"

      - name: Assemble signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pixelcake.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: pixelcake-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pixelcake.jks"
